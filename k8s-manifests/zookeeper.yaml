apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: dotnet-kafka-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
        - name: zookeeper
          image: bitnamilegacy/zookeeper:3.8
          env:
            - name: ALLOW_ANONYMOUS_LOGIN
              value: "yes"
          ports:
            - containerPort: 2181
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-svc
  namespace: dotnet-kafka-demo
spec:
  selector:
    app: zookeeper
  ports:
    - port: 2181
      targetPort: 2181
